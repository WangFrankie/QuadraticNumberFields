name = "QuadraticNumberFields"
version = "0.2.0"
keywords = ["math", "number-theory", "quadratic-fields"]
defaultTargets = [
  "QNFMathlib",
  "BinaryQuadraticForms",
  "QuadraticNumberFields",
  "FormClassGroup",
  "Examples"
]
lintDriver = "batteries/runLinter"

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "repl"
git = "https://github.com/leanprover-community/repl"
rev = "v4.35.0"

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"
rev = "3d425859e73fcfbef85b9638c2a91708ef4a22d4"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "QNFMathlib"

[[lean_lib]]
name = "BinaryQuadraticForms"

[[lean_lib]]
name = "QuadraticNumberFields"

[[lean_lib]]
name = "FormClassGroup"

[[lean_lib]]
name = "Examples"
