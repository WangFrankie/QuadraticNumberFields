name = "QuadraticNumberFields"
version = "0.2.0"
keywords = ["math", "number-theory", "quadratic-fields"]
defaultTargets = [
  "QNFMathlib",
  "BinaryQuadraticForms",
  "QuadraticNumberFields",
  "FormClassGroup",
  "ImaginaryClassNumberOne",
  "Examples"
]
lintDriver = "batteries/runLinter"

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "FiniteAbelianSmith"
git = "https://github.com/WangFrankie/FiniteAbelianSmith"
rev = "53054049c63d41a5c80d6ca274452a3856702255"

[[require]]
name = "repl"
git = "https://github.com/leanprover-community/repl"
rev = "v4.32.0"

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.1"

[[lean_lib]]
name = "QNFMathlib"

[[lean_lib]]
name = "BinaryQuadraticForms"

[[lean_lib]]
name = "QuadraticNumberFields"

[[lean_lib]]
name = "FormClassGroup"

[[lean_lib]]
name = "ImaginaryClassNumberOne"

[[lean_lib]]
name = "Examples"
