name: lake-build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lake-build:
    name: lake-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run lake build
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          lint: false
          test: false
