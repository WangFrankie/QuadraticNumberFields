name: sync-dev-after-promotion

on:
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  sync:
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync dev to main
        run: |
          git fetch origin main dev

          current_dev="$(git rev-parse origin/dev)"
          merged_head="${{ github.event.pull_request.head.sha }}"

          if [ "$current_dev" != "$merged_head" ]; then
            echo "origin/dev moved after the promotion PR was merged; skipping sync."
            echo "origin/dev: $current_dev"
            echo "merged PR head: $merged_head"
            exit 0
          fi

          git push origin origin/main:refs/heads/dev \
            --force-with-lease=refs/heads/dev:"$current_dev"
