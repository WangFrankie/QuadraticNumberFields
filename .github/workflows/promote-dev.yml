name: promote-dev

on:
  workflow_dispatch:
    inputs:
      summary:
        description: Optional promotion summary for the PR title and body
        required: false
        type: string

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build PR body
        run: |
          {
            echo "Manual promotion from dev to main."
            echo
            if [ -n "$SUMMARY" ]; then
              echo "## Summary"
              echo "$SUMMARY"
              echo
            fi
            echo "## Commits"
            git log origin/main..origin/dev --reverse --pretty=format:'- `%h` %s' || true
            echo
            echo
            echo "## Changed files"
            git diff --name-only origin/main..origin/dev | sed 's/^/- /' || true
          } > "$RUNNER_TEMP/promote-dev-body.md"
        env:
          SUMMARY: ${{ inputs.summary }}

      - name: Create PR dev to main
        run: |
          title="Promote dev to main"
          if [ -n "$SUMMARY" ]; then
            title="$title: $SUMMARY"
          fi

          gh pr create \
            --base main \
            --head dev \
            --title "$title" \
            --body-file "$RUNNER_TEMP/promote-dev-body.md" || \
          gh pr edit dev \
            --base main \
            --title "$title" \
            --body-file "$RUNNER_TEMP/promote-dev-body.md"
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ inputs.summary }}

      - name: Enable auto merge
        run: |
          gh pr merge dev --squash --auto || true
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
